buildscript {
    repositories {
        mavenCentral()
        maven { url 'https://cdn.fox2code.com/maven' }
    }
    dependencies {
        classpath('com.fox2code.FoxLoader:dev:2.0-alpha22')
    }
}

apply plugin: 'foxloader.dev'

group = 'com.fox2code'
version = '2.0.0'

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}

jar {
    from "LICENSE"
}

foxloader {
    modId = "reindevdiscordrpc"
    modName = "ReIndev Discord RPC"
    modIcon = "assets/examplemod/icon.png"
    modVersion = project.version
    modAuthors = "Fox2Code"
    modWebsite = "https://github.com/KingColton1/ReIndev-Discord-RPC/"
    modMain = "com.kingcolton1.reindevdiscordrpc.ReIndevDiscordRPC"
    modDesc("Discord RPC for ReIndev")
    modDesc()
    modDesc("You can check it's code at https://github.com/KingColton1/ReIndev-Discord-RPC")
}
