buildscript {
    repositories {
        mavenCentral()
        maven { url 'https://repo1.maven.org/maven2/' }
        maven { url 'https://cdn.fox2code.com/maven' }
    }
    dependencies {
        classpath('com.fox2code.FoxLoader:dev:2.0-alpha22')
    }
}

apply plugin: 'foxloader.dev'

group = 'com.kingcolton1'
version = '1.0'

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'

    implementation 'io.github.cdagaming:DiscordIPC:0.10.5'
}

test {
    useJUnitPlatform()
}

jar {
    from "LICENSE"
}

foxloader {
    modId = "reindevdiscordrpc"
    modName = "ReIndev Discord RPC"
    modIcon = "assets/reindevdiscordrpc/icon.png"
    modVersion = project.version
    modAuthors = "KingColton1"
    modWebsite = "https://github.com/KingColton1/ReIndev-Discord-RPC/"
    modMain = "com.kingcolton1.reindevdiscordrpc.ReindevDiscordRPC"
    modDesc = "Discord RPC for ReIndev"
}
